name: rso
description: Ruta Sin Obstáculos - Sistema de Reporte de Invasión al Espacio Público
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.0.0

  # UI
  cupertino_icons: ^1.0.6

  # Estado
  provider: ^6.0.5

  # Imágenes
  image_picker: ^1.0.5

  # Mapa — funciona en web Y móvil sin API key
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Geolocalización
  geolocator: ^10.1.0

  # Íconos adicionales
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets (para imágenes locales si las tienes)
  # assets:
  #   - assets/images/