name: rso
description: Ruta Sin Obstáculos - Sistema de Reporte de Invasión al Espacio Público
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  geocoding: ^3.0.0

  # Supabase
  supabase_flutter: ^2.12.2

  # UI
  cupertino_icons: ^1.0.6

  # Estado
  provider: ^6.1.5+1

  # Imágenes
  image_picker: ^1.2.1

  # Mapa — funciona en web y móvil sin API key
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Geolocalización
  geolocator: ^10.1.0

  # Íconos adicionales
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon_rso.png

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/icon_rso.png"

  min_sdk_android: 21

  adaptive_icon_background: "#0B1E3D"
  adaptive_icon_foreground: "assets/icon/icon_rso.png"

  web:
    generate: true
    image_path: "assets/icon/icon_rso.png"
    background_color: "#0B1E3D"
    theme_color: "#0B1E3D"